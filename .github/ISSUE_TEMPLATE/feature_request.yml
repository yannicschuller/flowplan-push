name: Feature request
description: Suggest an idea for the push relay
labels: ["enhancement"]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/yannicschuller/flowplan-push/issues?q=is%3Aissue) (open and closed).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the use case first.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
  - type: textarea
    id: context
    attributes:
      label: Anything else?
